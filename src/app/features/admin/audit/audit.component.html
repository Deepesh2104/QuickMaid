<div class="adm-page au-page">
  <header class="adm-hero">
    <div class="adm-hero-text">
      <p class="adm-eyebrow">Trust</p>
      <h1 class="adm-title">Audit log</h1>
      <p class="adm-sub">Immutable trail of sensitive actions — retention policy + SIEM export later.</p>
    </div>
    <div class="adm-hero-aside">
      <span class="adm-sync-pill" role="status">90d · scaffold</span>
      <button type="button" class="adm-btn adm-btn--ghost" (click)="export()">Export CSV</button>
    </div>
  </header>

  <div class="table-card table-card--adm">
    <div class="table-hdr table-hdr--adm">
      <div class="table-hdr-text">
        <div class="table-title">Recent events</div>
        <p class="table-hint">Actor, verb, resource — demo data</p>
      </div>
    </div>
    <div class="table-scroll">
      <table class="data-table data-table--adm">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Actor</th>
            <th>Action</th>
            <th>Target</th>
          </tr>
        </thead>
        <tbody>
          @for (r of rows; track r.at + r.action) {
            <tr>
              <td>{{ r.at }}</td>
              <td>{{ r.actor }}</td>
              <td><code style="font-size:11px">{{ r.action }}</code></td>
              <td>{{ r.target }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
