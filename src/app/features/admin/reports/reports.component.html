<div class="adm-page rp-page">
  <header class="adm-hero">
    <div class="adm-hero-text">
      <p class="adm-eyebrow">Finance & BI</p>
      <h1 class="adm-title">Reports hub</h1>
      <p class="adm-sub">Scheduled exports, ad-hoc queries, and email digests — connect BI tool in Phase 3.</p>
    </div>
    <div class="adm-hero-aside">
      <span class="adm-sync-pill" role="status">Jobs · scaffold</span>
      <button type="button" class="adm-btn adm-btn--primary" (click)="runNow()">Run report now</button>
    </div>
  </header>

  <div class="table-card table-card--adm">
    <div class="table-hdr table-hdr--adm">
      <div class="table-hdr-text">
        <div class="table-title">Scheduled reports</div>
        <p class="table-hint">Cron + S3 / email delivery</p>
      </div>
    </div>
    <div class="table-scroll">
      <table class="data-table data-table--adm">
        <thead>
          <tr>
            <th>Report</th>
            <th>Cadence</th>
            <th>Owner</th>
            <th>Next run</th>
          </tr>
        </thead>
        <tbody>
          @for (r of rows; track r.name) {
            <tr>
              <td>{{ r.name }}</td>
              <td>{{ r.cadence }}</td>
              <td>{{ r.owner }}</td>
              <td>{{ r.next }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
