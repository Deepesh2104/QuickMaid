<div class="page-header"><div class="page-title">Add New Maid 👩</div><div class="page-sub">Naye worker ka onboarding karo</div></div>

<div class="form-card">
  <div class="form-card-title">Personal Information</div>
  <div class="form-grid">
    <div class="fg2"><label class="fl2">Full Name</label><input class="fi2" placeholder="Savita Devi"></div>
    <div class="fg2"><label class="fl2">Phone Number</label><input class="fi2" placeholder="+91 98765 43210"></div>
    <div class="fg2"><label class="fl2">Aadhaar Number</label><input class="fi2" placeholder="1234 5678 9012"></div>
    <div class="fg2"><label class="fl2">Age</label><input class="fi2" placeholder="32"></div>
    <div class="fg2"><label class="fl2">Zone / Area</label><select class="fs2"><option>Tatibandh</option><option>Civil Lines</option><option>Shankar Nagar</option><option>Pandri</option></select></div>
    <div class="fg2"><label class="fl2">Service Type</label><select class="fs2"><option>Cleaning</option><option>Cooking</option><option>Bartan</option><option>All Services</option></select></div>
  </div>
</div>

<div class="form-card">
  <div class="form-card-title">Bank / UPI Details</div>
  <div class="form-grid">
    <div class="fg2"><label class="fl2">UPI ID</label><input class="fi2" placeholder="savita&#64;phonepe"></div>
    <div class="fg2"><label class="fl2">Bank Account</label><input class="fi2" placeholder="Account number"></div>
    <div class="fg2"><label class="fl2">IFSC Code</label><input class="fi2" placeholder="SBIN0001234"></div>
    <div class="fg2"><label class="fl2">Emergency Contact</label><input class="fi2" placeholder="+91 98765 11111"></div>
  </div>
</div>

<div class="form-card">
  <div class="form-card-title">Notes</div>
  <textarea class="fta" placeholder="Koi special skills ya notes..."></textarea>
</div>

<div class="form-actions">
  <button class="btn-save" (click)="toast.show('Maid added successfully! ✅','👩')">Save & Verify</button>
  <button class="btn-cancel" (click)="router.navigateByUrl('/admin/maids')">Cancel</button>
</div>
