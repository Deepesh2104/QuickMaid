<div class="page-header"><div class="page-title">Settings ⚙️</div><div class="page-sub">Platform configuration aur preferences</div></div>

<div class="form-card">
  <div class="form-card-title">General Settings</div>
  <div class="form-grid">
    <div class="fg2"><label class="fl2">Platform Name</label><input class="fi2" value="QuickMaid"></div>
    <div class="fg2"><label class="fl2">Support Phone</label><input class="fi2" value="+91 98765 43210"></div>
    <div class="fg2"><label class="fl2">Commission Rate (%)</label><input class="fi2" value="16" type="number"></div>
    <div class="fg2"><label class="fl2">No-Show Wait (min)</label><input class="fi2" value="15" type="number"></div>
    <div class="fg2"><label class="fl2">Max Booking Radius (km)</label><input class="fi2" value="3" type="number"></div>
    <div class="fg2"><label class="fl2">City</label><select class="fs2"><option>Raipur</option><option>Bhilai</option></select></div>
  </div>
</div>

<div class="form-actions"><button class="btn-save" (click)="toast.show('Settings saved!','⚙️')">Save Settings</button></div>
