<div class="pub-wrap">
  <nav class="pub-nav" aria-label="Public">
    <a routerLink="/" class="pub-brand">🏠 QuickMaid</a>
    <div class="pub-links">
      <a routerLink="/about" class="pub-link">About</a>
      <a routerLink="/contact" class="pub-link">Contact</a>
      <a routerLink="/terms" class="pub-link">Terms</a>
      <a routerLink="/book" class="pub-link">Web book</a>
      <a routerLink="/partner" class="pub-link">Partner</a>
      <a routerLink="/status" class="pub-link">Status</a>
      <a routerLink="/auth" class="pub-link">Staff login</a>
    </div>
  </nav>
  <main class="pub-main">
    <h1 class="pub-title">Book a visit</h1>
    <p class="pub-lead">Customer self-serve flow — payment + slot lock when backend is ready.</p>

    <div class="pub-card">
      <div class="pub-row">
        <label for="svc">Service</label>
        <select id="svc" [value]="service()" (change)="service.set(($any($event.target).value))">
          <option>Deep clean</option>
          <option>Regular</option>
          <option>Kitchen focus</option>
        </select>
      </div>
      <div class="pub-row">
        <label for="when">Preferred date</label>
        <input id="when" type="date" [min]="minDate" [value]="when()" (input)="when.set(($any($event.target).value))">
      </div>
      <div class="pub-row">
        <label for="addr">Address / landmark</label>
        <input id="addr" type="text" placeholder="Sector, street, flat…" [value]="address()" (input)="address.set(($any($event.target).value))">
      </div>
      <div class="pub-actions">
        <button type="button" class="pub-btn" (click)="submit()">Request slot</button>
        <a routerLink="/" class="pub-btn pub-btn--ghost">Back home</a>
      </div>
    </div>
  </main>
</div>
